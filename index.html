<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14112b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="물병 정렬">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="🧪 물병 정렬 — 한 병에는 한 가지 색만!">
<meta property="og:description" content="알록달록 물을 옮겨 담는 중독성 퍼즐. 봇보다 적게 움직이면 별 3개! 출렁이는 물과 폭죽까지 🎆">
<meta property="og:image" content="https://junhee1219.github.io/vase/og/main.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://junhee1219.github.io/vase/">
<meta name="twitter:card" content="summary_large_image">
<title>🧪 물병 정렬</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gowun+Dodum&display=swap');
  :root{
    --glass:rgba(255,255,255,0.07);
    --glass-border:rgba(255,255,255,0.16);
    --gold:#ffd66b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Gowun Dodum',sans-serif;
    height:100vh;height:100dvh;width:100vw;overflow:hidden;
    background:
      radial-gradient(circle at 15% 0%, #2a2350 0%, transparent 45%),
      radial-gradient(circle at 85% 100%, #16414d 0%, transparent 50%),
      linear-gradient(160deg, #14112b 0%, #0a0817 70%);
    color:#f1edff;display:flex;flex-direction:column;align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    position:relative;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    overscroll-behavior:none;
  }
  .glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:.3;z-index:0;pointer-events:none;}
  .glow.a{width:340px;height:340px;background:#ff5e9c;top:-110px;left:-80px;}
  .glow.b{width:320px;height:320px;background:#2bd9ff;bottom:-90px;right:-70px;}

  /* ── 상단 바 ── */
  .topbar{display:flex;align-items:center;gap:8px;z-index:2;width:100%;max-width:560px;flex:0 0 auto;}
  .topbar.sub{margin-top:6px;}
  h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.5px;background:linear-gradient(135deg,#ffd6e8,#bdeaff 50%,#e0caff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap;}
  .pill{background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;font-size:12px;font-family:'Fredoka',sans-serif;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .pill .par{opacity:.65;margin-left:2px;}
  .spacer{margin-left:auto;}
  button.btn{
    font-family:'Fredoka',sans-serif;font-size:15px;border:none;cursor:pointer;
    min-width:42px;min-height:36px;padding:6px 13px;border-radius:999px;color:#fff;
    transition:transform .15s,filter .15s;box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  button.btn:active{transform:scale(.93);}
  .btn-undo{background:linear-gradient(135deg,#5b8def,#7c5bef);}
  .btn-new{background:linear-gradient(135deg,#ff7eb3,#ff5e62);}
  .btn-hint{background:linear-gradient(135deg,#2bd9c0,#1aa6ff);}
  .btn-ghost{background:var(--glass);border:1px solid var(--glass-border);box-shadow:none;}

  /* ── 보드 ── */
  #board{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;align-items:center;gap:12px;z-index:2;width:100%;max-width:420px;min-height:0;padding:8px 0;}
  .tube{
    width:var(--w,42px);height:calc(var(--w,42px)*3.4);
    border:2px solid rgba(255,255,255,.32);border-top:none;border-radius:6px 6px 20px 20px;
    cursor:pointer;position:relative;transition:transform .2s cubic-bezier(.34,1.56,.64,1);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));
    box-shadow:inset 0 0 14px rgba(255,255,255,.06), 0 8px 20px rgba(0,0,0,.4);
  }
  .tube::before{content:'';position:absolute;top:-2px;left:-6px;right:-6px;height:6px;border:2px solid rgba(255,255,255,.32);border-bottom:none;border-radius:6px 6px 0 0;z-index:3;}
  .tube::after{content:'';position:absolute;top:8%;left:5px;width:5px;height:78%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));border-radius:4px;opacity:.5;pointer-events:none;z-index:4;}
  .tube.selected{transform:translateY(-12px) scale(1.05);border-color:#ffe27a;box-shadow:inset 0 0 14px rgba(255,226,122,.25),0 0 22px rgba(255,226,122,.55);}
  .tube.hint-target{border-color:#6ef0ff;box-shadow:inset 0 0 14px rgba(110,240,255,.25),0 0 22px rgba(110,240,255,.6);}
  .tube.complete{animation:pop .55s ease;border-color:rgba(255,214,107,.55);box-shadow:inset 0 0 16px rgba(255,214,107,.18),0 0 18px rgba(255,214,107,.35);}
  .tube.shake{animation:shake .4s;}
  .tube canvas.liq{position:absolute;inset:0;width:100%;height:100%;border-radius:4px 4px 18px 18px;z-index:1;pointer-events:none;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  #fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:50;pointer-events:none;}

  /* ── 토스트 ── */
  #toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:rgba(20,15,40,.92);border:1px solid var(--glass-border);backdrop-filter:blur(12px);
    padding:11px 20px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ── 클리어 오버레이 (탭해서 진행 — 자동 넘어가지 않음) ── */
  #clear{
    position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
    background:rgba(8,6,20,.55);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  #clear.show{opacity:1;pointer-events:auto;}
  .clear-card{
    background:rgba(24,18,48,.92);border:1px solid var(--glass-border);
    border-radius:26px;padding:28px 26px 22px;text-align:center;width:min(330px,88vw);
    box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
    transform:scale(.8);transition:transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  #clear.show .clear-card{transform:scale(1);}
  .clear-card h2{font-family:'Fredoka',sans-serif;font-size:26px;margin-bottom:4px;background:linear-gradient(135deg,#ffd6e8,#bdeaff 60%,#e0caff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  #stars{display:flex;justify-content:center;gap:10px;margin:14px 0 6px;height:54px;align-items:center;}
  #stars .star{font-size:44px;filter:grayscale(1) brightness(.45);transform:scale(.7);transition:none;}
  #stars .star.on{
    filter:none;
    animation:star-pop .5s cubic-bezier(.2,1.6,.4,1) forwards;
    text-shadow:0 0 18px rgba(255,214,107,.8);
  }
  #stars .star:nth-child(2){font-size:54px;}
  @keyframes star-pop{0%{transform:scale(.2) rotate(-30deg);}60%{transform:scale(1.25) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  #clear-stats{font-size:14px;opacity:.85;margin-bottom:2px;}
  #clear-record{
    display:none;font-family:'Fredoka',sans-serif;font-size:13px;color:#1c1233;font-weight:700;
    background:linear-gradient(135deg,#ffe27a,#ffb45e);border-radius:999px;padding:3px 12px;margin-top:6px;
  }
  #clear-record.show{display:inline-block;animation:pop .5s ease;}
  #btn-next{
    margin-top:16px;width:100%;font-family:'Fredoka',sans-serif;font-size:18px;font-weight:700;
    border:none;border-radius:16px;padding:14px 0;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#7c5bef,#1aa6ff);
    box-shadow:0 6px 18px rgba(60,80,220,.45), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s,filter .15s;
  }
  #btn-next:active{transform:scale(.96);}

  /* ── 간식 사주기 (클리어 화면에 은은하게 — cube 패턴) ── */
  #snack{margin-top:18px;font-size:12px;color:#9d93c2;}
  #snack .snack-btns{display:block;margin-top:9px;}
  #snack a{
    display:inline-block;text-decoration:none;font-weight:700;font-size:12px;
    padding:5px 12px;border-radius:999px;margin-left:4px;
    opacity:.9;transition:opacity .15s,transform .15s;
  }
  #snack a:active{transform:scale(.94);}
  #snack a.toss{background:#3182f6;color:#fff;}
  #snack a.kakao{background:#fee500;color:#3c1e1e;}

  /* ── 고마워요 모달 (PC 딥링크 fallback) ── */
  #thanks{
    position:fixed;inset:0;z-index:90;
    display:flex;align-items:center;justify-content:center;
    background:rgba(8,6,20,.6);backdrop-filter:blur(5px);
    animation:fadein .2s ease;
  }
  #thanks.hidden{display:none;}
  @keyframes fadein{from{opacity:0;}to{opacity:1;}}
  .thanks-card{
    background:#1d1738;border:1px solid var(--glass-border);
    border-radius:26px;padding:30px 28px;max-width:330px;width:86%;text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    animation:pop-in .3s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop-in{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .thanks-emoji{font-size:52px;margin-bottom:8px;}
  .thanks-card h2{font-family:'Fredoka',sans-serif;font-size:22px;color:#ffd6e8;margin-bottom:12px;}
  .thanks-card p{font-size:15px;color:#c9bfe8;line-height:1.55;}
  .thanks-card .thanks-sub{font-size:12px;color:#8d83b5;margin-top:12px;}
  #thanks-close{
    margin-top:20px;font-size:16px;font-weight:700;padding:12px 34px;font-family:'Fredoka',sans-serif;
    border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(135deg,#2bd9c0,#1aa6ff);color:#fff;
    box-shadow:0 5px 16px rgba(40,170,220,.4);
  }
  #thanks-close:active{transform:scale(.95);}

  /* 가로모드(낮은 화면): 8열×2행으로 펼쳐서 잘림 방지 */
  @media (max-height:520px){
    #board{grid-template-columns:repeat(8,1fr);max-width:760px;}
  }
  /* 좁은 화면 */
  @media (max-width:380px){
    h1{font-size:18px;}
    .pill{padding:5px 9px;font-size:11px;}
    button.btn{min-width:38px;padding:6px 10px;font-size:14px;}
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="topbar">
    <h1>물병 정렬</h1>
    <div class="pill">Lv <b id="level">1</b></div>
    <div class="pill">⭐ <b id="total-stars">0</b></div>
    <button class="btn btn-ghost" id="mute" aria-label="소리 켜기/끄기">🔊</button>
  </div>
  <div class="topbar sub">
    <div class="pill">이동 <b id="moves">0</b><span class="par">🎯 <b id="par">-</b></span></div>
    <div class="spacer"></div>
    <button class="btn btn-undo" id="undo" aria-label="되돌리기">↩</button>
    <button class="btn btn-hint" id="hint" aria-label="힌트">💡</button>
    <button class="btn btn-new" id="new" aria-label="새 게임">🔄</button>
  </div>

  <div id="board"></div>
  <canvas id="fx"></canvas>
  <div id="toast"></div>

  <!-- 클리어 오버레이: 버튼을 눌러야 다음 레벨 (간식 버튼이 머물 시간 확보) -->
  <div id="clear">
    <div class="clear-card">
      <h2>🎉 레벨 <span id="clear-level">1</span> 클리어!</h2>
      <div id="stars"><span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
      <div id="clear-stats">이동 <b id="clear-moves">0</b> · 🎯 <span id="clear-par">0</span></div>
      <span id="clear-record">🏆 신기록!</span>
      <button id="btn-next">다음 레벨 →</button>
      <div id="snack">
        <span class="snack-label">재밌었다면 개발자 간식 사주기</span> 🍩
        <span class="snack-btns">
          <a class="toss" href="supertoss://send?bank=토스뱅크&accountNo=100025266940&amount=3000">토스</a>
          <a class="kakao" href="https://qr.kakaopay.com/FP0dZW9ip" target="_blank" rel="noopener">카카오페이</a>
        </span>
      </div>
    </div>
  </div>

  <!-- PC에서 앱 딥링크가 안 열릴 때 띄우는 "마음만으로도 고마워요" 모달 -->
  <div id="thanks" class="hidden">
    <div class="thanks-card">
      <div class="thanks-emoji">🥹🧃</div>
      <h2>마음만으로도 감동이에요!</h2>
      <p>송금은 폰에서 열어야 동작하지만,<br>여기까지 눌러주신 것만으로도<br>개발자는 이미 주스 한 잔 마신 기분이에요 💜</p>
      <p class="thanks-sub">정 보내고 싶다면 폰으로 접속해서 눌러주세요!</p>
      <button id="thanks-close">고마워요 😊</button>
    </div>
  </div>

<script src="core.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
